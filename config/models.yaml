# GlobalMed Model Configuration
# Unified configuration for open-source and commercial models

# Models using max_completion_tokens instead of max_tokens
use_max_completion_tokens:
  - "o3"
  - "o1"
  - "o4-mini"
  - "gpt-5"
  - "gpt-5-mini"
  - "gpt-5-nano"

# Models supporting thinking/reasoning mode
supports_thinking:
  patterns:
    - "Qwen/Qwen3-*"
    - "baichuan-inc/Baichuan-M2-*"
    - "DeepSeek-R1*"

# Default generation parameters
default_generation_params:
  temperature: 0.7
  top_p: 0.9
  max_tokens: 4096
  n_sampling: 5

# Model-specific generation overrides
model_generation_overrides:
  "o1":
    reasoning_effort: "medium"
  "o3":
    reasoning_effort: "medium"
