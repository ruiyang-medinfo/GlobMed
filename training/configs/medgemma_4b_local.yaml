# Local smoke test of GlobMed-MedGemma-4B on 1 GPU (32 GB): 30 steps, global batch 2 x 8 = 16.
# Paper recipe: configs/medgemma_4b_paper.yaml

### model
model_name_or_path: google/medgemma-4b-it
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: full
deepspeed: third_party/LlamaFactory/examples/deepspeed/ds_z2_offload_config.json

### dataset
dataset_dir: data
dataset: globmed_direct,globmed_distill
template: gemma3
cutoff_len: 4096
max_samples: 2000
overwrite_cache: true
preprocessing_num_workers: 16
dataloader_num_workers: 4

### output
output_dir: outputs/medgemma_4b_local
logging_steps: 1
save_strategy: "no"
save_only_model: true
plot_loss: true
overwrite_output_dir: true
report_to: none

### train
per_device_train_batch_size: 2
gradient_accumulation_steps: 8
learning_rate: 1.0e-5
num_train_epochs: 1.0
max_steps: 30
lr_scheduler_type: cosine
warmup_ratio: 0.1
weight_decay: 0.0
bf16: true
flash_attn: fa2
ddp_timeout: 180000000
seed: 42
