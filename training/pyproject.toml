[project]
name = "globmed-training"
version = "0.1.0"
description = "Training code for the GlobMed-LLMs recipes on top of LLaMA-Factory"
requires-python = "==3.11.*"
dependencies = [
    "torch==2.8.0",
    "torchvision==0.23.0",
    "torchaudio==2.8.0",
    "transformers==4.57.1",
    "deepspeed==0.16.9",
    "flash-attn==2.8.3.post2",
    "vllm==0.11.0",
    "llamafactory[metrics,deepspeed]",
    "globalmed[vllm]",
]

[tool.uv]
package = false
exclude-newer = "2026-01-01T00:00:00Z"
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }
flash-attn = { url = "https://github.com/Dao-AILab/flash-attention/releases/download/v2.8.3.post2/flash_attn-2.8.3.post2+cu12torch2.8cxx11abiTRUE-cp311-cp311-linux_x86_64.whl" }
llamafactory = { path = "third_party/LlamaFactory", editable = true }
globalmed = { path = "..", editable = true }
