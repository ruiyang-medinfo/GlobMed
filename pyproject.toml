[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "GlobalMed"
version = "0.1.0"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    # Core
    "numpy>=1.26.4",
    # Data loading
    "datasets",
    "pandas",
    # Configuration
    "python-dotenv",
    "pyyaml",
    "hydra-core",
    # API clients
    "openai",
    "azure-ai-inference",
    # Results and utilities
    "prettytable",
    "scikit-learn",
    "shortuuid",
    "matplotlib",
    "tqdm",
]

[project.optional-dependencies]
vllm = [
    "vllm",
    "transformers",
]
dev = [
    "pytest",
    "pytest-asyncio",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
